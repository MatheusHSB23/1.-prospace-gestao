name: Publicar Portal de Gestão

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-gestao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar Portal de Gestão
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar Portal de Gestão
        id: deployment
        uses: actions/deploy-pages@v4
